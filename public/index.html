<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>チームタスク管理</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <span class="logo">📋</span>
        <div>
          <h1>チームタスク管理</h1>
          <p id="today" class="subtitle"></p>
        </div>
      </div>
      <div class="scope">
        <select id="sel-dept"><option value="">部: すべて</option></select>
        <select id="sel-group"><option value="">グループ: すべて</option></select>
        <select id="sel-team"><option value="">チーム: すべて</option></select>
        <select id="sel-member"><option value="">人: すべて</option></select>
        <button id="btn-refresh" class="quick" title="ボードを再読み込み">🔄 更新</button>
      </div>
    </header>

    <div class="layout">
      <!-- ==== タスクボード ==== -->
      <section class="board-pane">
        <div id="board-status" class="board-status">「🔄 更新」を押すと Asana からタスクを読み込みます</div>
        <div class="board">
          <div class="column" data-status="overdue">
            <h2>⚠️ 期限切れ</h2>
            <div class="cards" id="col-overdue"></div>
          </div>
          <div class="column" data-status="today">
            <h2>🔥 今日やること</h2>
            <div class="cards" id="col-today"></div>
          </div>
          <div class="column" data-status="upcoming">
            <h2>📅 予定</h2>
            <div class="cards" id="col-upcoming"></div>
          </div>
        </div>
        <details class="done-area">
          <summary>✅ 完了したタスク (<span id="done-count">0</span>)</summary>
          <div class="cards done-cards" id="col-done"></div>
        </details>
      </section>

      <!-- ==== キャラクター & チャット ==== -->
      <aside class="side-pane">
        <div class="character-card">
          <div class="mascot" id="mascot">
            <div class="ear left"></div>
            <div class="ear right"></div>
            <div class="face">
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="blush left"></div>
              <div class="blush right"></div>
              <div class="mouth"></div>
            </div>
          </div>
          <div class="character-info">
            <div class="character-name" id="char-name">…</div>
            <div class="speech-bubble" id="speech">起動中…</div>
          </div>
        </div>

        <div class="quick-actions">
          <button class="quick" data-prompt="今日のタスクを教えて">🔥 今日のタスク</button>
          <button class="quick" data-prompt="今週の予定を教えて">📅 今週の予定</button>
          <button id="btn-minutes" class="quick">📝 議事録を反映</button>
          <button id="btn-reset" class="quick ghost">🗑 リセット</button>
        </div>

        <main id="chat" class="chat"></main>

        <footer class="composer">
          <textarea id="input" rows="1"
            placeholder="メッセージや議事録を入力… (Shift+Enterで改行)"></textarea>
          <button id="send" title="送信">➤</button>
        </footer>
      </aside>
    </div>
  </div>

  <div id="mini-mascot" class="mini-mascot" hidden>🎉</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
